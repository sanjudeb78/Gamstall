<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gamestall India - The premier global destination for official APKs, mobile engines, and professional creator tools.">
    <meta name="keywords" content="APK, Store, Mod, India, Gamestall, Mobile Apps, Download, GS Store, Verified APK">
    <meta name="author" content="Gamestall India">
    <meta name="google-site-verification" content="AHpoEvuus5UaW8NkMuQ37EICbjcOfKNKknHP4eEZtcM" />
    <title>Gamestall India | Global App Store</title>

    <!-- UI Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --brand-blue: #2A52F3; --bg-black: #050505; --zinc-card: #0f0f10; }
        body { background-color: var(--bg-black); color: #e4e4e7; font-family: 'Outfit', sans-serif; scroll-behavior: smooth; }
        h1, h2, h3, .font-bangers { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        
        /* CSS-ONLY LOGO */
        .gs-logo { width: 46px; height: 46px; background: #ffffff; border: 3px solid var(--brand-blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-style: italic; color: var(--brand-blue); font-size: 1.5rem; box-shadow: 0 0 20px rgba(42, 82, 243, 0.3); cursor: pointer; }
        
        /* View Handling */
        .view-pane { display: none; min-height: 80vh; }
        .view-active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .app-card { background: var(--zinc-card); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .app-card:hover { transform: translateY(-8px); border-color: var(--brand-blue); box-shadow: 0 15px 30px rgba(42, 82, 243, 0.15); }
        
        input, textarea, select { background: #121214 !important; border: 1px solid #27272a !important; color: white !important; }
        .admin-tab-control.active { color: var(--brand-blue); border-bottom: 3px solid var(--brand-blue); }
        .category-header { border-left: 4px solid var(--brand-blue); padding-left: 15px; margin-bottom: 25px; }
        .shimmer { background: linear-gradient(90deg, #121214 25%, #1a1a1c 50%, #121214 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white">

    <!-- Navbar -->
    <nav class="sticky top-0 z-[100] bg-black/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4 cursor-pointer group" onclick="location.hash='#home'">
                <div class="gs-logo transition-transform group-hover:scale-105">GS</div>
                <div class="hidden sm:block">
                    <h1 class="text-2xl leading-none text-white tracking-wider">GAMESTALL INDIA</h1>
                    <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-[0.3em]">Official Cloud Store</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-6 text-xs font-black uppercase tracking-widest text-zinc-400">
                <a href="#home" class="hover:text-white transition">Browse</a>
                <a href="#submit" class="hover:text-white transition">Publish</a>
                
                <!-- Navbar Auth UI -->
                <div id="auth-ui" class="flex items-center">
                    <a href="#signin" id="signin-link" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg hover:bg-blue-700 transition">Sign In</a>
                    <div id="user-profile-pfp" class="hidden">
                        <img id="user-google-img" src="" class="w-10 h-10 rounded-full border-2 border-blue-600 object-cover cursor-pointer hover:scale-110 transition" title="Logout" onclick="logoutUser()">
                    </div>
                </div>

                <button onclick="handleAdminEntry()" id="admin-icon-btn" class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center hover:text-white transition"><i class="fas fa-user-shield"></i></button>
            </div>
        </div>
    </nav>

    <!-- Search Bar -->
    <div id="search-container" class="max-w-4xl mx-auto mt-8 px-4">
        <div class="relative group">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-zinc-600 group-focus-within:text-blue-500 transition"></i>
            <input type="text" id="global-search" oninput="searchApps(this.value)" placeholder="Search Apps, Games, Tools..." class="w-full pl-14 pr-6 py-4 rounded-2xl outline-none border border-zinc-800 focus:border-blue-600 transition shadow-2xl">
        </div>
    </div>

    <!-- 1. HOME VIEW -->
    <section id="view-home" class="view-pane view-active px-4 py-12 max-w-7xl mx-auto">
        <div class="mb-16"><h2 class="text-4xl font-bangers italic uppercase category-header">Apps</h2><div id="grid-app" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div></div>
        <div class="mb-16"><h2 class="text-4xl font-bangers italic uppercase category-header">Games</h2><div id="grid-game" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div></div>
        <div class="mb-16"><h2 class="text-4xl font-bangers italic uppercase category-header">Tools</h2><div id="grid-tool" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div></div>
        
        <div class="mt-20 pt-10 border-t border-zinc-800">
            <h2 class="text-3xl font-bangers italic uppercase mb-8 opacity-50">Global Catalogue</h2>
            <div id="app-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 text-center">
                <div class="col-span-full py-20 opacity-30 italic shimmer h-64 rounded-3xl"></div>
            </div>
        </div>
    </section>

    <!-- 2. SUBMIT VIEW -->
    <section id="view-submit" class="view-pane px-4 py-16 max-w-4xl mx-auto">
        <div class="bg-zinc-900 border border-zinc-800 p-8 md:p-12 rounded-[3rem] shadow-2xl">
            <h2 class="text-5xl font-bangers mb-6 uppercase italic">Submit APK</h2>
            <form id="form-submit" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <input type="text" id="sub-name" placeholder="App Name" required class="w-full px-5 py-4 rounded-2xl outline-none">
                    <select id="sub-category" required class="w-full px-5 py-4 rounded-2xl outline-none">
                        <option value="App">App</option><option value="Game">Game</option><option value="Tools">Tools</option>
                    </select>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <input type="url" id="sub-url" placeholder="Direct APK URL" required class="w-full px-5 py-4 rounded-2xl outline-none">
                    <input type="file" id="sub-icon" accept="image/*" required class="w-full text-xs">
                </div>
                <input type="text" id="sub-user" placeholder="Developer Name" required class="w-full px-5 py-4 rounded-2xl outline-none">
                <textarea id="sub-desc" placeholder="Description" rows="4" required class="w-full px-5 py-4 rounded-2xl outline-none"></textarea>
                <button type="submit" class="w-full py-5 bg-blue-600 text-white font-black uppercase text-xl rounded-2xl">Push Submission</button>
            </form>
        </div>
    </section>

    <!-- 3. SIGN IN VIEW (Strictly hidden when session active) -->
    <section id="view-signin" class="view-pane px-4 py-20 flex items-center justify-center">
        <div id="signin-box" class="max-w-md w-full bg-zinc-900 border border-zinc-800 p-10 rounded-[3rem] shadow-2xl text-center">
            <div class="gs-logo mx-auto mb-6">GS</div>
            <h2 class="text-4xl font-bangers mb-2 uppercase italic tracking-wider">Authorize Session</h2>
            <p class="text-zinc-500 mb-10 text-sm">Sign in with Google to continue.</p>
            <div id="g_id_onload" data-client_id="713421189204-r7t76g04gn32vhqta07f6asdvumceqr3.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
            <div class="g_id_signin flex justify-center" data-type="standard" data-theme="filled_blue" data-text="continue_with" data-size="large"></div>
        </div>
    </section>

    <!-- 4. DOWNLOAD VIEW -->
    <section id="view-download" class="view-pane px-4 py-12 max-w-6xl mx-auto"><div id="download-page-content"></div></section>

    <!-- 5. ADMIN/OWNER VIEW -->
    <section id="view-admin" class="view-pane px-4 py-12 max-w-6xl mx-auto">
        <div id="admin-dash" class="hidden">
            <div class="mb-10">
                <h2 id="panel-title" class="text-6xl font-bangers italic uppercase text-white">Panel</h2>
                <p class="text-blue-500 font-bold uppercase text-[10px] tracking-[0.4em]">Governance Node</p>
            </div>
            <div class="flex items-center space-x-8 border-b border-zinc-800 mb-12 overflow-x-auto">
                <button onclick="switchAdminTab('inbox')" id="btn-inbox" class="admin-tab-control active py-4 font-black uppercase text-sm tracking-widest italic whitespace-nowrap">Inbox</button>
                <button onclick="switchAdminTab('manage')" id="btn-manage" class="admin-tab-control py-4 font-black uppercase text-sm tracking-widest italic whitespace-nowrap">Manage</button>
                <button onclick="switchAdminTab('add')" id="btn-add" class="admin-tab-control py-4 font-black uppercase text-sm tracking-widest italic whitespace-nowrap">Add App</button>
                <button onclick="switchAdminTab('members')" id="btn-members" class="admin-tab-control py-4 font-black uppercase text-sm tracking-widest italic whitespace-nowrap text-brand-yellow hidden">Members</button>
            </div>
            <div id="pane-inbox" class="admin-view-pane space-y-4"></div>
            <div id="pane-manage" class="admin-view-pane hidden"><div id="manage-list" class="grid gap-4"></div></div>
            <div id="pane-add" class="admin-view-pane hidden max-w-2xl mx-auto">
                <form id="form-admin-add" class="space-y-4 bg-zinc-900 p-8 rounded-[3rem]">
                    <input type="text" id="add-name" placeholder="App Name" required class="w-full px-5 py-3 rounded-xl">
                    <select id="add-category" class="w-full px-5 py-3 rounded-xl"><option value="App">App</option><option value="Game">Game</option><option value="Tools">Tools</option></select>
                    <input type="text" id="add-size" placeholder="Size" required class="w-full px-5 py-3 rounded-xl">
                    <input type="url" id="add-url" placeholder="Download Link" required class="w-full px-5 py-3 rounded-xl">
                    <input type="file" id="add-icon" accept="image/*" required class="w-full text-xs">
                    <textarea id="add-desc" placeholder="Description" required class="w-full px-5 py-3 rounded-xl"></textarea>
                    <button type="submit" class="w-full py-4 bg-blue-600 text-white font-black uppercase rounded-xl">Publish</button>
                </form>
            </div>
            <div id="pane-members" class="admin-view-pane hidden"><div class="grid gap-4" id="members-list"></div></div>
        </div>
    </section>

    <!-- Editor Modal -->
    <div id="editor-modal" class="fixed inset-0 z-[6000] bg-black/90 flex items-center justify-center hidden p-4">
        <div class="max-w-2xl w-full bg-zinc-900 border border-zinc-800 p-8 rounded-[3rem] shadow-2xl">
            <h3 class="text-4xl font-bangers mb-6 text-blue-500 uppercase">Update Metadata</h3>
            <form id="form-admin-edit" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="text" id="edit-name" placeholder="Name" required class="w-full px-5 py-3 rounded-xl">
                <select id="edit-category" required class="w-full px-5 py-3 rounded-xl">
                    <option value="App">App</option><option value="Game">Game</option><option value="Tools">Tools</option>
                </select>
                <input type="text" id="edit-size" placeholder="Size" required class="w-full px-5 py-3 rounded-xl">
                <input type="url" id="edit-url" placeholder="Download Link" required class="w-full px-5 py-3 rounded-xl">
                <div class="flex flex-col text-left"><label class="text-[10px] font-black uppercase text-zinc-600 ml-2 mb-2">Update Icon</label><input type="file" id="edit-icon" accept="image/*" class="w-full text-xs"></div>
                <textarea id="edit-desc" placeholder="Description" rows="3" required class="w-full px-5 py-3 rounded-xl"></textarea>
                <div class="flex gap-4">
                    <button type="submit" class="flex-1 py-4 bg-blue-600 text-white font-black uppercase rounded-xl">Save Changes</button>
                    <button type="button" onclick="closeEditor()" class="px-8 py-4 bg-zinc-800 text-white font-black uppercase rounded-xl">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-20 border-t border-zinc-900 text-center opacity-30 hover:opacity-100 transition-opacity">
        <div class="gs-logo mx-auto mb-6 grayscale pointer-events-none">GS</div>
        <p class="text-[10px] font-black uppercase tracking-[0.5em] mb-4">&copy; 2024 Gamestall India</p>
    </footer>

    <script>
        Parse.initialize("gdp56t0SntfY059QN1BorjF7kU5NPymP88qWas09", "P4dQ9BClDIOXDJVmuL0OhLtdX2w0pgnfGiYwgGyu");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        let appsCache = [];
        let currentEditId = null;
        let currentUserEmail = localStorage.getItem('gs_user_email');
        const OWNER = "sanjudeb78@gmail.com";

        const routeManager = () => {
            const hash = window.location.hash || '#home';
            if(currentUserEmail && hash === '#signin') { window.location.hash = '#home'; return; }

            document.querySelectorAll('.view-pane').forEach(v => v.classList.remove('view-active'));
            if(hash.startsWith('#app/')) {
                renderDownloadPage(hash.split('/')[1]);
                document.getElementById('view-download').classList.add('view-active');
            } else {
                const target = document.getElementById(`view-${hash.substring(1)}`) || document.getElementById('view-home');
                target.classList.add('view-active');
            }
            if(hash === '#home') fetchApps();
            checkUserSession();
        };

        window.addEventListener('hashchange', routeManager);
        window.addEventListener('load', routeManager);

        const toBase64 = file => new Promise((res) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => res(reader.result);
        });

        function checkUserSession() {
            if(currentUserEmail) {
                document.getElementById('signin-link')?.classList.add('hidden');
                document.getElementById('view-signin')?.classList.remove('view-active');
                document.getElementById('user-profile-pfp').classList.remove('hidden');
                document.getElementById('user-google-img').src = localStorage.getItem('gs_user_pic');
            }
        }

        async function handleCredentialResponse(response) {
            let payload = JSON.parse(decodeURIComponent(atob(response.credential.split('.')[1]).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
            const randomPass = "gs_pass_" + payload.sub.substring(0,8);

            try {
                await Parse.User.logIn(payload.email, randomPass);
            } catch (error) {
                let user = new Parse.User();
                user.set("username", payload.email); 
                user.set("password", randomPass);
                user.set("email", payload.email);
                user.set("role", payload.email === OWNER ? "owner" : "user");
                try { await user.signUp(); } catch(e) { console.error("Signup error", e); return; }
            }
            
            localStorage.setItem('gs_user_email', payload.email);
            localStorage.setItem('gs_user_pic', payload.picture);
            currentUserEmail = payload.email;
            location.hash = "#home"; 
            location.reload();
        }

        function logoutUser() { if(confirm("Sign out?")) { localStorage.clear(); location.reload(); } }

        async function handleAdminEntry() {
            const user = Parse.User.current();
            if(!user && currentUserEmail !== OWNER) { location.hash = "#signin"; return; }
            
            const role = user ? user.get('role') : (currentUserEmail === OWNER ? 'owner' : 'user');
            if(currentUserEmail === OWNER || role === 'owner' || role === 'admin') {
                location.hash = "#admin";
                document.getElementById('admin-gate').classList.add('hidden');
                document.getElementById('admin-dash').classList.remove('hidden');
                document.getElementById('panel-title').innerText = currentUserEmail === OWNER ? "Owner Panel" : "Admin Panel";
                if(currentUserEmail === OWNER) document.getElementById('btn-members').classList.remove('hidden');
                switchAdminTab('inbox');
            } else { alert("Access Denied: Node Restricted."); }
        }

        async function fetchApps() {
            const grid = document.getElementById('app-grid');
            const sections = { App: document.getElementById('grid-app'), Game: document.getElementById('grid-game'), Tools: document.getElementById('grid-tool') };
            try {
                appsCache = await new Parse.Query("AppDatabase").descending("createdAt").find();
                const render = (a) => `<div class="app-card rounded-[2.5rem] p-6 flex flex-col h-full group"><img src="${a.get('icon') || ''}" class="w-16 h-16 rounded-2xl mb-6 object-cover shadow-2xl transition group-hover:scale-110"><h3 class="text-2xl text-white font-bangers uppercase truncate">${a.get('name')}</h3><button onclick="location.hash='#app/${a.id}'" class="mt-auto py-3 bg-white text-black font-black rounded-xl uppercase text-[10px]">Download</button></div>`;
                grid.innerHTML = appsCache.map(render).join('');
                Object.keys(sections).forEach(cat => { sections[cat].innerHTML = appsCache.filter(a => a.get('category') === cat).map(render).join('') || '<p class="opacity-10 italic">Empty</p>'; });
            } catch (e) { grid.innerHTML = "Sync error."; }
        }

        async function renderDownloadPage(id) {
            const container = document.getElementById('download-page-content');
            const app = await new Parse.Query("AppDatabase").get(id);
            const d = app.attributes;
            container.innerHTML = `<div class="flex flex-col lg:flex-row gap-16 items-center text-center md:text-left"><img src="${d.icon || ''}" class="w-64 h-64 rounded-[4rem] shadow-2xl border-4 border-white/5 object-cover"><div class="flex-1"><h2 class="text-8xl text-white font-bangers italic leading-none mb-6">${d.name}</h2><p class="text-zinc-400 text-xl leading-relaxed mb-12 italic border-l-4 border-blue-600 pl-8">${d.desc}</p><a href="${d.download}" target="_blank" class="inline-block px-16 py-6 bg-blue-600 text-white font-black rounded-[2rem] uppercase text-xl">Get Official APK</a></div></div>`;
        }

        function switchAdminTab(t) {
            document.querySelectorAll('.admin-view-pane').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.admin-tab-control').forEach(b => b.classList.remove('active'));
            document.getElementById(`pane-${t}`).classList.remove('hidden');
            document.getElementById(`btn-${t}`).classList.add('active');
            if(t === 'inbox') fetchInbox();
            if(t === 'manage') fetchManage();
            if(t === 'members') fetchMembers();
        }

        async function fetchInbox() {
            const res = await new Parse.Query("Submissions").find();
            document.getElementById('pane-inbox').innerHTML = res.map(s => `<div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[3rem] flex justify-between items-center"><div class="flex items-center gap-4"><img src="${s.get('icon') || ''}" class="w-12 h-12 rounded-lg object-cover"><h4 class="text-3xl text-white italic font-bangers uppercase">${s.get('name')}</h4></div><button onclick="approveSub('${s.id}')" class="px-6 py-3 bg-green-600 rounded-xl font-bold uppercase text-xs">Approve</button></div>`).join('') || "Inbox Clear.";
        }

        async function fetchManage() {
            const res = await new Parse.Query("AppDatabase").find();
            const isOwner = currentUserEmail === OWNER;
            document.getElementById('manage-list').innerHTML = res.map(app => `<div class="bg-zinc-900 p-6 rounded-[2rem] flex justify-between items-center border border-zinc-800"><div class="flex items-center gap-4"><img src="${app.get('icon') || ''}" class="w-10 h-10 rounded-lg object-cover grayscale"><span class="font-bold text-white uppercase italic">${app.get('name')}</span></div><div class="flex gap-4"><button onclick="openEditor('${app.id}')" class="text-blue-500 font-black">Edit</button>${isOwner ? `<button onclick="deleteRow('AppDatabase','${app.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}</div></div>`).join('');
        }

        function openEditor(id) {
            const app = appsCache.find(a => a.id === id);
            currentEditId = id; document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = app.get('name'); document.getElementById('edit-category').value = app.get('category') || "App";
            document.getElementById('edit-size').value = app.get('size'); document.getElementById('edit-url').value = app.get('download'); document.getElementById('edit-desc').value = app.get('desc');
            document.getElementById('editor-modal').classList.remove('hidden');
        }
        function closeEditor() { document.getElementById('editor-modal').classList.add('hidden'); }
        
        document.getElementById('form-admin-edit').addEventListener('submit', async (e) => {
            e.preventDefault();
            const app = await new Parse.Query("AppDatabase").get(document.getElementById('edit-id').value);
            const updates = { name: document.getElementById('edit-name').value, category: document.getElementById('edit-category').value, size: document.getElementById('edit-size').value, download: document.getElementById('edit-url').value, desc: document.getElementById('edit-desc').value };
            const file = document.getElementById('edit-icon').files[0];
            if(file) updates.icon = await toBase64(file);
            await app.save(updates); alert("Updated."); closeEditor(); fetchManage();
        });

        document.getElementById('form-submit').addEventListener('submit', async (e) => {
            e.preventDefault(); const file = document.getElementById('sub-icon').files[0];
            const s = new (Parse.Object.extend("Submissions"))();
            await s.save({ name: document.getElementById('sub-name').value, category: document.getElementById('sub-category').value, dl: document.getElementById('sub-url').value, desc: document.getElementById('sub-desc').value, user: document.getElementById('sub-user').value, icon: await toBase64(file) });
            alert("Sent!"); location.hash = '#home';
        });

        document.getElementById('form-admin-add').addEventListener('submit', async (e) => {
            e.preventDefault(); const file = document.getElementById('add-icon').files[0];
            const a = new (Parse.Object.extend("AppDatabase"))();
            await a.save({ name: document.getElementById('add-name').value, category: document.getElementById('add-category').value, size: document.getElementById('add-size').value, download: document.getElementById('add-url').value, desc: document.getElementById('add-desc').value, icon: await toBase64(file) });
            alert("Published!"); location.hash = "#home";
        });

        async function approveSub(id) {
            const s = await new Parse.Query("Submissions").get(id);
            const a = new (Parse.Object.extend("AppDatabase"))();
            await a.save({ name: s.get('name'), category: s.get('category'), download: s.get('dl'), desc: s.get('desc'), size: '72MB', icon: s.get('icon') });
            await s.destroy(); fetchInbox();
        }

        async function deleteRow(cls, id) { if(confirm("Purge?")) { await (await new Parse.Query(cls).get(id)).destroy(); cls === 'Submissions' ? fetchInbox() : fetchManage(); } }

        function searchApps(val) {
            const q = val.toLowerCase();
            document.getElementById('app-grid').innerHTML = appsCache.filter(a => a.get('name').toLowerCase().includes(q)).map(app => `<div class="app-card rounded-[2.5rem] p-6 flex flex-col h-full group"><h3 class="text-2xl text-white font-bangers uppercase truncate">${app.get('name')}</h3><button onclick="location.hash='#app/${app.id}'" class="mt-auto py-3 bg-white text-black font-black rounded-xl uppercase text-[10px]">Download</button></div>`).join('');
